plugins { id 'com.android.application' }

android {
    namespace 'org.orca.console'
    compileSdk 34
    defaultConfig {
        applicationId "org.orca.console"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "0.3.2"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The app bundles the same touch console the server uses.
tasks.register('copyConsole', Copy) {
    from "$rootDir/../orca/console"
    into "$projectDir/src/main/assets/console"
}
preBuild.dependsOn copyConsole
