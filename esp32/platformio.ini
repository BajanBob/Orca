; PlatformIO project for the Orca ESP32 field node.
; Build:  pio run           Flash:  pio run -t upload
; Or open esp32/orca_node/orca_node.ino in the Arduino IDE (board: ESP32 Dev Module).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    sandeepmistry/LoRa @ ^0.8.0
build_src_filter = +<../orca_node/>
