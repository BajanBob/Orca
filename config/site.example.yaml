# Orca site configuration. Copy to site.yaml and edit.
site:
  name: Barbados regional mesh
  node: BB-BGI-PORT            # this server's node id
  region: itu2                 # itu1 | itu2 | itu3 (region pack)
  lat: 13.103
  lon: -59.630

data_dir: ./data               # keys, baseline, captures, audit log

# ---- RF hardware -----------------------------------------------------------
# Simulator (default): runs anywhere, with optional scenarios:
#   gnss_jam, gnss_spoof, ch16_carrier, new_emitter, repeater_down
sdr:
  kind: auto            # auto-detect a plugged-in RTL-SDR or HackRF; simulator if none
  scenarios: [gnss_jam]
# Real hardware - receive only. Pick ONE of the blocks below.
#
# RTL-SDR dongle on the Windows build (NESDR, RTL-SDR Blog, etc.; uses the bundled
# rtlsdr.dll - no SoapySDR. Bind it to WinUSB with Zadig first):
# sdr:
#   kind: rtlsdr
#   max_rate: 2.4e6
#   gain_db: 40            # omit for automatic gain
#
# HackRF on the Windows build (no SoapySDR needed - uses the bundled hackrf.dll):
# sdr:
#   kind: hackrf
#   max_rate: 10e6
#   lna_gain: 16            # 0-40 step 8
#   vga_gain: 20            # 0-62 step 2
#   amp: 0                  # 1 = enable the front-end amp
#
# Any SDR through SoapySDR (Linux/Pi, or Windows from source with SoapySDR):
# sdr:
#   kind: soapy
#   args: "driver=hackrf"   # or driver=rtlsdr, driver=airspy, driver=uhd, driver=rx888
#   gain: 30                   # omit for AGC
#   max_rate: 20e6

# Receivers and block downconverters you own. Orca plans coverage DC to Ku
# from these and shows any gaps. Keys are listed in orca/bands.py.
inventory:
  receivers: [sim]             # e.g. [soundcard, rx888, hackrf]
  frontends: []                # e.g. [c_bdc, x_bdc, ku_lnb_low, ku_lnb_high, ku_bdc]

view: {lo: 1568.0e6, hi: 1583.0e6}   # start on GPS L1 (fits one 16 MHz tune)

# ---- Nodes (Skylark2040 GNSS) ---------------------------------------------
nodes:
  - {id: BB-BGI-PORT, name: Bridgetown port,   lat: 13.103, lon: -59.630, tool: Skylark2040, gnss: {kind: sim}}
  - {id: BB-BGI-HARB, name: Harbour master,    lat: 13.098, lon: -59.636, tool: Skylark2040, gnss: {kind: sim}}
  - {id: BB-HAST,     name: Hastings,          lat: 13.076, lon: -59.600, tool: Skylark2040, gnss: {kind: sim}}
  - {id: BB-GAIA,     name: Airport perimeter, lat: 13.075, lon: -59.492, tool: Skylark2040, gnss: {kind: sim}}
  # real receivers:
  # - {id: BB-X, name: ..., lat: .., lon: .., tool: Skylark2040, gnss: {kind: gpsd, host: 127.0.0.1, port: 2947}}
  # - {id: BB-Y, name: ..., lat: .., lon: .., tool: Skylark2040, gnss: {kind: nmea, device: /dev/ttyACM0, baud: 9600}}

# ---- Tradewind Commander (APRS) -------------------------------------------
aprs:
  mode: sim                    # sim | kiss (Direwolf/TNC) | aprsis (receive only)
  host: 127.0.0.1
  port: 8001
  callsign: ""                 # your licensed callsign; needed to transmit
  transmit: false              # bulletins stay "not sent" until true AND callsign set
  aprsis_filter: r/13.1/-59.6/100
  watch:                       # stations that should be heard regularly
    - {call: 8P6RT-7, every_s: 60}

# ---- Uranus (WSJT-X UDP: FT8/FT4/WSPR) -------------------------------------
uranus: {mode: sim, port: 2237}  # mode: sim | udp

# ---- Network (syslog) ---------------------------------------------------------
syslog: {mode: sim, port: 5514}   # mode: sim | udp

# Extra channels to protect at this site (added to the global distress list)
protected_extra:
  - {name: "Holetown EmComm 147.000", lo: 146.994e6, hi: 147.006e6}

anomaly_z: 6.0

# ---- Phase 4 mesh (off-grid sync) ------------------------------------------
# Detections sync peer-to-peer. Over a radio (troposcatter/VHF/LoRa) KISS link
# when radio.enabled; otherwise a mesh of one. Store-and-forward rides fades.
mesh:
  peers: []
  radio: {enabled: false, host: 127.0.0.1, port: 8001, min_quality: 0.15}

# ---- Troposcatter experiment (2 m / 70 cm beyond-line-of-sight) -------------
# Plans and measures a trans-horizon amateur link (e.g. island to island). When
# enabled, Orca predicts the link budget and measures received SNR, fading and
# availability on `freq`, and feeds that availability to the radio mesh link.
tropo:
  enabled: false
  name: "Barbados - St Lucia 2 m"
  freq: 144.2e6              # agreed experiment frequency (above 148? no: 2 m is amateur, clear mode)
  distance_km: 150
  power_w: 100
  gain_t: 13                # antenna gain each end, dBi
  gain_r: 13
  height_t: 40              # antenna height, m (sets the takeoff angle)
  height_r: 40
  mode: ft8                 # cw | ssb | ft8 | msk144

# ---- Secure module (government / defence edition) --------------------------
# Disabled by default. When enabled it encrypts and DECRYPTS the operator's OWN
# communications on licensed, non-amateur frequencies above floor_hz. It does
# NOT defeat third-party encryption. Amateur allocations are always excluded.
secure:
  enabled: false
  floor_hz: 148.0e6          # no secure operation below this (keeps out of 2 m)
  authority: ""              # licence / tasking reference; required to operate
  licensed_bands: []         # e.g. [[150.0e6, 174.0e6], [406.0e6, 420.0e6]]
  keys_hex: []               # operator's own AES-256 keys, 64 hex chars each
  baud: 1200

agent:
  autorun_safe_steps: true     # Beryl runs non-transmitting steps itself
  llm:
    enabled: false             # true + ANTHROPIC_API_KEY env var for richer triage notes
    model: claude-sonnet-5-5

# Cognition: the on-device situation engine + Ask Orca (natural-language queries).
# Works offline; set llm.enabled (and ANTHROPIC_API_KEY) to add Claude reasoning.
cognition:
  llm:
    enabled: false
    model: claude-sonnet-5-5

server: {host: 0.0.0.0, port: 8088}
