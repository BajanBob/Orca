name: Build Windows and Android apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pywebview pyserial
      - name: Test
        run: python -m pytest -q
      - name: Build Orca server (single .exe)
        run: >
          pyinstaller --noconfirm --clean --noupx --paths . --onefile --console --name orca-server
          --add-data "orca/console;orca/console" --add-data "config;config"
          --collect-submodules uvicorn --collect-submodules websockets
          --collect-submodules orca packaging/orca_server.py
      - name: Build Orca Desktop (windowed app)
        run: >
          pyinstaller --noconfirm --clean --noupx --paths . --onedir --windowed --name OrcaDesktop
          --add-data "orca/console;orca/console" --add-data "config;config"
          --collect-submodules uvicorn --collect-submodules websockets
          --collect-submodules orca --collect-all webview packaging/orca_desktop.py
      - name: Smoke test the server .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/orca-server.exe -ArgumentList '--port','8099' -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $s = Invoke-RestMethod http://127.0.0.1:8099/api/state; $ok = $s.type -eq 'hello' } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "orca-server.exe did not answer" }
          Write-Host "orca-server.exe answered /api/state"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item README.md dist/OrcaDesktop/
          Copy-Item config/site.example.yaml dist/OrcaDesktop/
          Compress-Archive -Path dist/OrcaDesktop -DestinationPath out/Orca-Desktop-Windows-x64.zip
          New-Item -ItemType Directory -Force srv | Out-Null
          Copy-Item dist/orca-server.exe, README.md srv/
          Copy-Item config/site.example.yaml srv/site.yaml
          Compress-Archive -Path srv/* -DestinationPath out/Orca-Server-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build Orca server (single binary)
        run: >
          pyinstaller --noconfirm --clean --onefile --name orca-server --paths .
          --add-data "orca/console:orca/console" --add-data "config:config"
          --collect-submodules uvicorn --collect-submodules websockets
          --collect-submodules orca packaging/orca_server.py
      - name: Smoke test the Linux binary
        run: |
          ./dist/orca-server --port 8099 &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf http://127.0.0.1:8099/api/state | grep -q '"type":"hello"'; then ok=1; break; fi
          done
          kill $PID || true
          [ $ok -eq 1 ] || { echo "orca-server did not answer"; exit 1; }
          echo "orca-server answered /api/state"
      - name: Package Linux build
        run: |
          mkdir -p out linux
          cp dist/orca-server packaging/orca-linux.sh config/site.example.yaml README.md linux/
          chmod +x linux/orca-server linux/orca-linux.sh
          (cd linux && zip -q ../out/Orca-Linux-x64.zip *)
      - name: Package SDR Edition (source + SoapySDR setup for real radios)
        run: |
          mkdir -p sdredition/Orca-SDR-Edition
          cp -r orca android packaging config requirements.txt README.md sdredition/Orca-SDR-Edition/
          chmod +x sdredition/Orca-SDR-Edition/packaging/sdr-setup.sh
          (cd sdredition && zip -qr ../out/Orca-SDR-Edition.zip Orca-SDR-Edition \
            -x '*/__pycache__/*' '*/console/*.map')
      - name: Package Raspberry Pi build (source + systemd service)
        run: |
          mkdir -p pi/Orca-RaspberryPi
          cp -r orca config requirements.txt README.md pi/Orca-RaspberryPi/
          mkdir -p pi/Orca-RaspberryPi/packaging
          cp packaging/pi-setup.sh packaging/sdr-setup.sh packaging/orca.service pi/Orca-RaspberryPi/packaging/
          chmod +x pi/Orca-RaspberryPi/packaging/*.sh
          (cd pi && zip -qr ../out/Orca-RaspberryPi.zip Orca-RaspberryPi -x '*/__pycache__/*')
      - name: Package ESP32 firmware
        run: |
          mkdir -p esp/Orca-ESP32-Firmware
          cp -r esp32/* esp/Orca-ESP32-Firmware/
          (cd esp && zip -qr ../out/Orca-ESP32-Firmware.zip Orca-ESP32-Firmware)
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Package
        run: |
          mkdir -p out
          VER="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' orca/__init__.py)"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Orca-Console-$VER.apk"
          (cd out && zip -q Orca-Android-APK.zip "Orca-Console-$VER.apk" && rm "Orca-Console-$VER.apk")
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*

  release:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release tag comes from the package version, e.g. v0.2.0
          TAG="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' orca/__init__.py)"
          if gh release view "$TAG" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "${GITHUB_REPOSITORY}"
            exit 0
          fi
          GITHUB_REF_NAME="$TAG"
          gh release create "$TAG" dist/* -R "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "Orca ${GITHUB_REF_NAME}" \
            --notes "Orca ${GITHUB_REF_NAME}

          - Orca-Desktop-Windows-x64.zip: unzip and run OrcaDesktop.exe (Windows 10/11, uses the WebView2 runtime). Starts in simulator mode; edit %LOCALAPPDATA%\\Orca\\site.yaml for real hardware.
          - Orca-Server-Windows-x64.zip: orca-server.exe plus site.yaml. Run it, then open http://<pc-ip>:8088 from any tablet or phone.
          - Orca-Linux-x64.zip: a single orca-server binary plus orca-linux.sh. Run ./orca-linux.sh (or ./orca-server --config site.yaml). Built on Ubuntu; works on recent x86-64 Linux.
          - Orca-SDR-Edition.zip: source plus packaging/sdr-setup.sh, which installs SoapySDR and drivers for real receivers (RTL-SDR, Airspy, HackRF, USRP, RX888). Use config/site.sdr.yaml. For any machine with a supported SDR.
          - Orca-RaspberryPi.zip: source plus packaging/pi-setup.sh, which installs the SDR/GNSS stack and a systemd service so the Pi runs Orca headless on boot. Tested on Raspberry Pi OS (Pi 4/5).
          - Orca-ESP32-Firmware.zip: Arduino/PlatformIO firmware for an ESP32 field node (GNSS sensor + LoRa mesh / burst-chat relay). Flash with the Arduino IDE or PlatformIO. Set LoRa frequency for your ITU region.
          - Orca-Android-APK.zip: the touch console for Android 7+. Tap Server to connect to your Orca PC, or Phone USB radio to use an RTL-SDR stick plugged into the phone (needs the free RTL-SDR driver app); demo mode without either. Debug-signed: allow installs from this source.

          The executables are not code-signed yet, so Windows SmartScreen may warn on first run."
